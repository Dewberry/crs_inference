[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crs_inference*"]

[tool.setuptools.dynamic]
version = {attr = "crs_inference.__version__"}

[project]
name = "crs-inference"
dynamic = ["version"]
description = "Automatic CRS inference for geospatial models using geographic overlap."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Dewberry" }]

dependencies = [
    "boto3>=1.37.28",
    "geopandas>=1.0.1",
    "obstore>=0.6.0",
    "psutil>=7.0.0",
    "python-dotenv>=1.2.2",
    "shapely>=2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9"]
ops = [
    "matplotlib>=3.10.1",
    "pympler>=1.1",
    "pynhd>=0.19.3",
    "pystac>=1.15.2",
]

[project.urls]
Repository = "https://github.com/Dewberry/crs_inference"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "LOG", "BLE", "FURB", "RUF"]
