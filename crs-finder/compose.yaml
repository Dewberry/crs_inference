services:
  backend:
    build:
      context: ../
      dockerfile: crs-finder/backend/Dockerfile
    networks:
      - internal
    environment:
      PYTHONUNBUFFERED: "1"
    # Volumes for local development — remove in production
    # volumes:
    #   - ./backend/src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  internal:
    driver: bridge
