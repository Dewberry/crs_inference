server {
    listen 80;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://tile.openstreetmap.org https://server.arcgisonline.com https://basemaps.cartocdn.com; font-src 'self';" always;

    # Serve the compiled React application
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Support client-side routing — fall back to index.html
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/* requests to the FastAPI container
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Increase timeouts for potentially slow geospatial processing jobs
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Support large file uploads
        client_max_body_size 500M;
    }
}
